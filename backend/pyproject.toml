[project]
name = "tasklane-backend"
version = "0.1.0"
description = "Tasklane API and workers"
requires-python = ">=3.13,<3.14"
# Ranges keep us on the approved release lines; uv.lock holds the exact versions.
dependencies = [
    "fastapi>=0.162.0,<0.163",            # pre-1.0: minor releases may break, so stay on one
    "uvicorn[standard]>=0.54.0,<0.55",    # [standard] adds watchfiles (used by --reload)
    "pydantic>=2.12.5,<2.13",
    "pydantic-settings>=2.16.2,<3",
    "sqlalchemy>=2.0.55,<2.1",
    "psycopg[binary]>=3.3.6,<3.4",
    "redis>=6.4.0,<6.5",                  # kombu 5.6 allows the Redis client up to <6.5
    "alembic>=1.20,<2",                   # database migrations (like knex/Prisma migrate)
    "celery[redis]>=5.6.3,<5.7",          # task queue (like BullMQ); Redis is the broker
    # Celery 5.6 sets no upper bound on kombu; stay on the 5.6 line it was released with.
    "kombu>=5.6.2,<5.7",
    # PDF parsing (pure Python, BSD-3). [crypto] adds `cryptography`, needed to open PDFs that
    # are encrypted with only an owner password (print/copy restrictions).
    "pypdf[crypto]>=6.21.4,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "httpx>=0.28.1,<0.29",   # used by FastAPI's TestClient
    "ruff>=0.17.3,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]
markers = [
    "integration: needs the real PostgreSQL and Redis containers from compose.yaml",
    "e2e: starts real worker and dispatcher processes (slower); skip with -m 'not e2e'",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
