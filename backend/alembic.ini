# Alembic configuration. The database URL is NOT stored here: migrations/env.py builds it from
# the same environment variables the app uses (POSTGRES_USER, POSTGRES_PASSWORD, ...).

[alembic]
script_location = %(here)s/migrations
# Files are named like 0002_add_job_list_indexes.py when created with --rev-id 0002.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
